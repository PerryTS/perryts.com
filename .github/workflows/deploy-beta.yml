name: Check and deploy beta

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an active deployment before starting the next one.
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:site
      - run: npm run check:blog

      - name: Deploy beta
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BETA_DEPLOY_SSH_KEY: ${{ secrets.BETA_DEPLOY_SSH_KEY }}
          BETA_DEPLOY_KNOWN_HOSTS: ${{ secrets.BETA_DEPLOY_KNOWN_HOSTS }}
          BETA_DEPLOY_SERVER: perryts-beta-deploy@webserver.skelpo.net
        run: |
          set -euo pipefail
          test -n "$BETA_DEPLOY_SSH_KEY"
          test -n "$BETA_DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/beta_deploy_key ~/.ssh/config ~/.ssh/known_hosts' EXIT
          printf '%s\n' "$BETA_DEPLOY_SSH_KEY" > ~/.ssh/beta_deploy_key
          printf '%s\n' "$BETA_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/beta_deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'SSH'
          Host webserver.skelpo.net
            IdentityFile ~/.ssh/beta_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          SSH
          chmod 600 ~/.ssh/config
          npm run deploy:beta -- --skip-build
          echo 'Deployed to https://beta.perryts.com/' >> "$GITHUB_STEP_SUMMARY"
