# Managed by the repo: deploy.sh installs this to /etc/nginx/sites-available/perryts.com
# on every deploy (via deploy/install-nginx.sh). Do not edit on the server.
# Canonical host: https://www.perryts.com. Apex and plain HTTP redirect to it.

server {
    listen 80;
    server_name perryts.com www.perryts.com;
    return 301 https://www.perryts.com$request_uri;
}

# Apex -> www
server {
    listen 443 ssl;
    server_name perryts.com;
    ssl_certificate /etc/letsencrypt/live/perryts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perryts.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.perryts.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.perryts.com;

    ssl_certificate /etc/letsencrypt/live/perryts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/perryts.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/perryts.com/current/out;
    error_page 404 /404.html;

    # Static assets with long cache
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # OG images (extensionless PNGs)
    location ~ /opengraph-image$ {
        default_type image/png;
        try_files $uri =404;
    }

    # Root goes to the English homepage with a real 301 (a meta refresh would drop the visitor's referrer from analytics).
    location = / {
        return 301 /en/;
    }

    # Newsletter subscribe helper (Node service)
    location /api/ {
        proxy_pass http://127.0.0.1:3851;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files directly; locale-less paths fall through to @fallback
    location / {
        try_files $uri $uri/index.html $uri.html @fallback;
    }

    # Locale-less paths redirect to the default locale (/showcase -> /en/showcase)
    location @fallback {
        if (-f $document_root/en$uri/index.html) {
            return 301 /en$uri;
        }
        return 404;
    }
}
