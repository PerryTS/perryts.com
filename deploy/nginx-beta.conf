server {
    listen 80;
    server_name beta.perryts.com;
    return 301 https://beta.perryts.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name beta.perryts.com;

    ssl_certificate /etc/letsencrypt/live/beta.perryts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.perryts.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/beta.perryts.com/current/out;
    index index.html;
    error_page 404 /404.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        return 308 /en/$is_args$args;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3852;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8k;
    }

    location / {
        try_files $uri $uri/index.html $uri.html @english;
    }

    location @english {
        if (-f $document_root/en$uri/index.html) {
            return 301 /en$uri$is_args$args;
        }
        return 404;
    }
}
